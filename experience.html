<div class="lightbox-overlay" onclick="closeLightbox()">
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-prev" aria-label="Previous" onclick="event.stopPropagation();lightboxNav(-1)">&lsaquo;</button>
  <img src="" alt="" onclick="event.stopPropagation()">
  <button class="lightbox-next" aria-label="Next" onclick="event.stopPropagation();lightboxNav(1)">&rsaquo;</button>
</div>

<script>
// Clean URLs: GitHub Pages serves /trips for trips.html, so hide the
// extension in the address bar (skipped when browsing via file://)
if (location.protocol !== 'file:' && /\.html$/.test(location.pathname)) {
  history.replaceState(null, '', location.pathname.replace(/\.html$/, '').replace(/\/index$/, '/') + location.search + location.hash);
}

// Dark mode toggle (shared across pages - keep in sync)
(function() {
  var btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  function syncLabel() {
    var dark = document.body.classList.contains('latex-dark');
    btn.textContent = dark ? 'Light Mode' : 'Dark Mode';
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }
  btn.addEventListener('click', function() {
    document.body.classList.toggle('latex-dark');
    localStorage.setItem('theme', document.body.classList.contains('latex-dark') ? 'dark' : 'light');
    // Nudge canvas redraws (travel globe) so line color follows the new theme
    window.dispatchEvent(new Event('resize'));
    syncLabel();
  });
  syncLabel();
})();

// Mobile nav dropdown (shared across pages - keep in sync)
(function() {
  var btn = document.querySelector('.nav-toggle');
  var sidebar = document.querySelector('.sidebar');
  if (!btn || !sidebar) return;
  function setOpen(open) {
    sidebar.classList.toggle('nav-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function() {
    setOpen(!sidebar.classList.contains('nav-open'));
  });
  document.addEventListener('click', function(e) {
    if (!sidebar.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') setOpen(false);
  });
})();

(function() {
  var btn = document.querySelector('.back-to-top');
  var bar = document.querySelector('.progress-bar');
  window.addEventListener('scroll', function() {
    btn.classList.toggle('visible', window.scrollY > 400);
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = h > 0 ? (window.scrollY / h * 100) + '%' : '0%';
  });
})();
var lbImages = [];
var lbIndex = 0;
var lbOverlay = document.querySelector('.lightbox-overlay');
var lbImg = lbOverlay.querySelector('img');
var lbPrev = lbOverlay.querySelector('.lightbox-prev');
var lbNext = lbOverlay.querySelector('.lightbox-next');
function showLbImage() {
  var item = lbImages[lbIndex];
  lbImg.src = item.src;
  lbImg.alt = item.alt;
  lbPrev.classList.toggle('hidden', lbIndex === 0);
  lbNext.classList.toggle('hidden', lbIndex === lbImages.length - 1);
}
function openLightbox(img) {
  var gallery = img.closest('.gallery');
  if (gallery) {
    var imgs = gallery.querySelectorAll('img');
    lbImages = [];
    imgs.forEach(function(i) {
      var fig = i.closest('figure');
      var capEl = fig ? fig.querySelector('figcaption') : null;
      lbImages.push({ src: i.src, alt: i.alt });
    });
    lbIndex = Array.from(imgs).indexOf(img);
  } else {
    var fig = img.closest('figure');
    var capEl = fig ? fig.querySelector('figcaption') : null;
    lbImages = [{ src: img.src, alt: img.alt }];
    lbIndex = 0;
  }
  showLbImage();
  lbOverlay.classList.add('active');
}
function closeLightbox() {
  lbOverlay.classList.remove('active');
  lbImages = [];
}
function lightboxNav(dir) {
  var next = lbIndex + dir;
  if (next >= 0 && next < lbImages.length) {
    lbIndex = next;
    showLbImage();
  }
}
document.addEventListener('keydown', function(e) {
  if (!lbOverlay.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lightboxNav(-1);
  if (e.key === 'ArrowRight') lightboxNav(1);
});
document.querySelectorAll('.gallery img, article > figure img').forEach(function(img) {
  img.style.cursor = 'pointer';
  img.addEventListener('click', function(e) {
    e.stopPropagation();
    openLightbox(this);
  });
});
document.querySelectorAll('article table:not(.gantt)').forEach(function(t) {
  if (!t.parentElement.classList.contains('table-scroll-wrap') &&
      !t.parentElement.classList.contains('scroll-wrapper')) {
    var wrap = document.createElement('div');
    wrap.className = 'table-scroll-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  }
});
</script>
